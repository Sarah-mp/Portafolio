name: CI and Deploy

on:
  pull_request:
  push:
    branches:
      - main

# Cancela runs anteriores del mismo branch/PR para ahorrar minutos de Actions
concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Lint + Typecheck + Build ──────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}

  # ─── Job 2: Deploy Preview en Pull Requests ───────────────────────────────
  deploy_preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}

      - name: Deploy Preview to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: portafolio
          directory: dist
          branch: ${{ github.head_ref }}
          # gitHubToken comenta el PR con la URL del preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ─── Job 3: Deploy Producción en push a main ──────────────────────────────
  deploy_production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}

      - name: Deploy Production to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: portafolio
          directory: dist
          branch: main

# Secrets necesarios en GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN  — token con permisos de Cloudflare Pages
#   CLOUDFLARE_ACCOUNT_ID — ID de la cuenta Cloudflare
#   PUBLIC_SITE_URL       — URL final del sitio (ej: https://portafolio.pages.dev)
